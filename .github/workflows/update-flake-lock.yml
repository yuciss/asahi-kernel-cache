name: Update flake.lock

# Bumps every input (nixpkgs, apple-silicon-support) to latest and opens
# a PR with the new flake.lock. Merging that PR is what triggers
# build-asahi-kernel.yml, so you get a review step before any kernel
# rebuild happens.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'  # weekly; remove if you'd rather trigger manually only

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update all flake inputs
        run: nix flake update

      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "flake.lock: update all inputs"
          title: "Update flake.lock (nixpkgs + apple-silicon-support)"
          branch: update-flake-lock
          body: |
            Automated update of all flake inputs to their latest revisions.
            Merging this will change the linux-asahi derivation hash and
            trigger a fresh kernel build on the next push.
