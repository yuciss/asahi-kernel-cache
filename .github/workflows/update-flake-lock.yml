name: Update flake.lock

# Manual only. Runs `nix flake update` (bumps nixpkgs and
# apple-silicon-support to their latest revisions) and commits the
# result straight to main. Does NOT build or touch Cachix — run
# kernel-cache.yml separately afterward if you want a build from the
# new lock.

on:
  workflow_dispatch:

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update all flake inputs
        run: nix flake update

      - name: Commit and push if flake.lock changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- flake.lock; then
            echo "No changes to flake.lock"
          else
            git add flake.lock
            git commit -m "flake.lock: update all inputs"
            git push
          fi
